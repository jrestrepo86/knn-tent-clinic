name: knn-tent-clinic
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.7
  - numpy
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - plotly
  - pytest
  - black
  - isort
  - flake8
  - jupyter
  - pip
  - setuptools
  - wheel
  - pip:
      - -e . # Install the current directory in editable mode
      - pytest-cov
      - pre-commit
