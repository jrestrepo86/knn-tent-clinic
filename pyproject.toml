[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knn-tent-clinic"
version = "0.1.0"
description = "KNN-based tent clinic analysis"
authors = [{ name = "Juan F. Restrepo", email = "juan.restrepo@uner.edu.ar" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "plotly", 'ray']

[project.urls]
Source = "https://github.com/jrestrepo86/knn-tent-clinic.git"
Repository = "https://github.com/jrestrepo86/knn-tent-clinic.git"

[project.optional-dependencies]
test = ["pytest>=6.2.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]

[tool.setuptools.package-data]
"knn_tent_clinic" = ["data/*.txt", "data/*.csv"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | *.egg-info
  | venv
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
ignore = ['E203', 'E501']
exclude = ['.git', '__pycache__', 'build', 'dist', '*.egg-info', 'venv']
